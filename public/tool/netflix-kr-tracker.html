<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix KR uNoGS Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #181a20;
      --panel-2: #20232b;
      --ink: #f5f7fb;
      --muted: #a8afbd;
      --soft: #d6d9e0;
      --line: #303541;
      --red: #e50914;
      --teal: #24c6a8;
      --gold: #e7b75f;
      --blue: #6aa8ff;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(229, 9, 20, 0.12), transparent 32rem),
        linear-gradient(180deg, #111217 0%, #0d0e11 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.85rem, 3vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      white-space: nowrap;
    }

    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) minmax(130px, 170px) minmax(130px, 170px) auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 26, 32, 0.94);
      box-shadow: var(--shadow);
      position: sticky;
      top: 10px;
      z-index: 2;
      backdrop-filter: blur(12px);
    }

    .tabs {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111318;
    }

    .tab {
      min-width: 102px;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .tab[aria-selected="true"] {
      background: var(--red);
      color: white;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    label,
    .label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #111318;
      color: var(--ink);
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .refresh {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(229, 9, 20, 0.55);
      border-radius: 7px;
      background: rgba(229, 9, 20, 0.14);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .refresh:hover {
      background: rgba(229, 9, 20, 0.28);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .stat strong {
      display: block;
      font-size: 1.55rem;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .status {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--soft);
      text-align: center;
    }

    .status[hidden] {
      display: none;
    }

    [hidden] {
      display: none !important;
    }

    .status p {
      margin: 8px auto 0;
      max-width: 520px;
      color: var(--muted);
    }

    .status .link {
      margin-top: 14px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .art {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(135deg, rgba(229, 9, 20, 0.38), rgba(36, 198, 168, 0.22)),
        #171a20;
    }

    .art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      color: rgba(255, 255, 255, 0.84);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .body {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      max-width: 100%;
      overflow: hidden;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--soft);
      font-size: 0.78rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-chip {
      background: rgba(229, 9, 20, 0.18);
      color: #ffb8bd;
    }

    .new-chip {
      background: rgba(36, 198, 168, 0.16);
      color: #a8f3e5;
    }

    .synopsis {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
    }

    .link.primary {
      border-color: rgba(229, 9, 20, 0.6);
      background: rgba(229, 9, 20, 0.16);
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .meta {
        justify-content: flex-start;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .tabs,
      .field:first-of-type {
        grid-column: 1 / -1;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .toolbar,
      .summary {
        grid-template-columns: 1fr;
      }

      .tab {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">South Korea</p>
        <h1>Netflix KR uNoGS Tracker</h1>
      </div>
      <div class="meta" aria-live="polite">
        <span class="pill" id="collectedAt">Not loaded</span>
        <span class="pill" id="sourceCount">0 titles</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Dashboard controls">
      <div class="tabs" role="tablist" aria-label="List type">
        <button class="tab" id="tab-expiring" type="button" role="tab" aria-selected="true" aria-controls="titleGrid" data-mode="expiring">Expiring</button>
        <button class="tab" id="tab-new" type="button" role="tab" aria-selected="false" aria-controls="titleGrid" data-mode="new">New</button>
      </div>

      <div class="field">
        <label for="searchBox">Search</label>
        <input id="searchBox" type="search" autocomplete="off" placeholder="Title, genre, year, IMDb ID">
      </div>

      <div class="field">
        <label for="typeFilter">Type</label>
        <select id="typeFilter">
          <option value="">All types</option>
          <option value="movie">Movies</option>
          <option value="series">Series</option>
        </select>
      </div>

      <div class="field">
        <label for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="date">Date</option>
          <option value="title">Title</option>
          <option value="year">Year</option>
        </select>
      </div>

      <button class="refresh" id="refreshBtn" type="button">Refresh</button>
    </section>

    <section class="summary" aria-label="Snapshot summary">
      <div class="stat">
        <strong id="visibleCount">0</strong>
        <span>visible</span>
      </div>
      <div class="stat">
        <strong id="movieCount">0</strong>
        <span>movies</span>
      </div>
      <div class="stat">
        <strong id="seriesCount">0</strong>
        <span>series</span>
      </div>
      <div class="stat">
        <strong id="candidateCount">0</strong>
        <span>candidates analyzed</span>
      </div>
    </section>

    <section class="status" id="loadingState" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Loading Netflix KR titles</strong>
    </section>

    <section class="status" id="emptyState" hidden>
      <strong id="emptyTitle">No matching titles</strong>
      <p id="emptyMessage"></p>
      <a class="link primary" id="emptyLink" href="https://unogs.com/countrydetail" target="_blank" rel="noopener noreferrer" hidden>Check uNoGS</a>
    </section>

    <section class="status" id="errorState" hidden role="alert">
      <strong>Unable to load tracker data</strong>
      <p id="errorMessage"></p>
    </section>

    <section class="grid" id="titleGrid" aria-label="Netflix titles"></section>
  </main>

  <script>
    const WORKER_BASE_URL = "https://unogs-kr-tracker.thejjw.workers.dev";
    const ENDPOINTS = {
      expiring: "/api/expiring.json",
      new: "/api/new.json"
    };
    const UNOGS_COUNTRY_URL = "https://unogs.com/countrydetail";

    const state = {
      mode: "expiring",
      snapshots: {},
      filtered: [],
      loading: false,
      error: ""
    };

    const elements = {
      tabs: Array.from(document.querySelectorAll(".tab")),
      searchBox: document.getElementById("searchBox"),
      typeFilter: document.getElementById("typeFilter"),
      sortSelect: document.getElementById("sortSelect"),
      refreshBtn: document.getElementById("refreshBtn"),
      grid: document.getElementById("titleGrid"),
      loading: document.getElementById("loadingState"),
      empty: document.getElementById("emptyState"),
      emptyTitle: document.getElementById("emptyTitle"),
      emptyMessage: document.getElementById("emptyMessage"),
      emptyLink: document.getElementById("emptyLink"),
      error: document.getElementById("errorState"),
      errorMessage: document.getElementById("errorMessage"),
      collectedAt: document.getElementById("collectedAt"),
      sourceCount: document.getElementById("sourceCount"),
      visibleCount: document.getElementById("visibleCount"),
      movieCount: document.getElementById("movieCount"),
      seriesCount: document.getElementById("seriesCount"),
      candidateCount: document.getElementById("candidateCount")
    };

    /** Fetches and normalizes the active snapshot from the configured Worker. */
    async function loadSnapshot(forceReload) {
      if (state.snapshots[state.mode] && !forceReload) {
        render();
        return;
      }

      state.loading = true;
      state.error = "";
      renderShell();

      try {
        const response = await fetch(WORKER_BASE_URL + ENDPOINTS[state.mode], {
          headers: { "Accept": "application/json" },
          cache: forceReload ? "reload" : "default"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status + " from tracker Worker");
        }

        const snapshot = await response.json();
        state.snapshots[state.mode] = normalizeSnapshot(snapshot);
      } catch (error) {
        state.error = error && error.message ? error.message : String(error);
      } finally {
        state.loading = false;
        render();
      }
    }

    /** Converts a Worker snapshot into predictable arrays and string fields. */
    function normalizeSnapshot(snapshot) {
      const items = Array.isArray(snapshot && snapshot.items) ? snapshot.items : [];
      return {
        sourceUrl: stringValue(snapshot && snapshot.sourceUrl),
        collectedAt: stringValue(snapshot && snapshot.collectedAt),
        candidatesAnalyzed: numberValue(snapshot && snapshot.candidatesAnalyzed),
        items: items.map((item) => ({
          title: stringValue(item.title),
          netflixId: stringValue(item.netflixId),
          url: stringValue(item.url),
          type: stringValue(item.type).toLowerCase(),
          year: stringValue(item.year),
          synopsis: stringValue(item.synopsis),
          runtime: stringValue(item.runtime),
          imdbId: stringValue(item.imdbId),
          posterUrl: stringValue(item.posterUrl),
          boxartUrl: stringValue(item.boxartUrl),
          boxartEmbedded: stringValue(item.boxartEmbedded),
          genres: Array.isArray(item.genres) ? item.genres.map(stringValue).filter(Boolean) : [],
          expiryDate: stringValue(item.expiryDate),
          expiryText: stringValue(item.expiryText),
          addedDate: stringValue(item.addedDate),
          addedText: stringValue(item.addedText),
          collectedAt: stringValue(item.collectedAt)
        }))
      };
    }

    /** Repaints the dashboard from current state and filters. */
    function render() {
      renderShell();

      if (state.loading || state.error) {
        elements.grid.innerHTML = "";
        return;
      }

      const snapshot = activeSnapshot();
      const query = elements.searchBox.value.trim().toLowerCase();
      const type = elements.typeFilter.value;
      const sort = elements.sortSelect.value;

      state.filtered = snapshot.items
        .filter((item) => matchesType(item, type))
        .filter((item) => matchesQuery(item, query))
        .sort((a, b) => compareItems(a, b, sort));

      renderSummary(snapshot);
      renderEmptyState(snapshot);
      elements.empty.hidden = state.filtered.length !== 0;
      elements.grid.innerHTML = "";
      elements.grid.append(...state.filtered.map(createCard));
    }

    /** Updates shared metadata and state containers. */
    function renderShell() {
      const snapshot = activeSnapshot();
      const total = snapshot.items.length;

      elements.tabs.forEach((tab) => {
        const selected = tab.dataset.mode === state.mode;
        tab.setAttribute("aria-selected", String(selected));
      });

      elements.loading.hidden = !state.loading;
      elements.error.hidden = !state.error;
      elements.empty.hidden = true;
      elements.errorMessage.textContent = state.error;
      elements.refreshBtn.disabled = state.loading;
      elements.collectedAt.textContent = snapshot.collectedAt ? "Collected " + formatDate(snapshot.collectedAt) : "Not loaded";
      elements.sourceCount.textContent = total + " " + plural(total, "title");
    }

    /** Updates aggregate counts for the active filtered list. */
    function renderSummary(snapshot) {
      const visible = state.filtered.length;
      const movies = state.filtered.filter((item) => item.type === "movie").length;
      const series = state.filtered.filter((item) => item.type === "series").length;
      const candidates = snapshot.candidatesAnalyzed || snapshot.items.length;

      elements.visibleCount.textContent = String(visible);
      elements.movieCount.textContent = String(movies);
      elements.seriesCount.textContent = String(series);
      elements.candidateCount.textContent = String(candidates);
    }

    /** Sets empty-state copy for source-empty snapshots and filter misses. */
    function renderEmptyState(snapshot) {
      const hasSourceItems = snapshot.items.length > 0;
      const label = state.mode === "expiring" ? "expiring titles" : "new titles";

      if (hasSourceItems) {
        elements.emptyTitle.textContent = "No matching titles";
        elements.emptyMessage.textContent = "Try a different search or filter.";
        elements.emptyLink.hidden = true;
        return;
      }

      elements.emptyTitle.textContent = "No " + label + " right now";
      elements.emptyMessage.textContent =
        "uNoGS is currently returning zero " + label +
        " for South Korea. If uNoGS shows titles that are missing here, let me know.";
      elements.emptyLink.href = snapshot.sourceUrl || UNOGS_COUNTRY_URL;
      elements.emptyLink.hidden = false;
    }

    /** Builds one title card without assigning untrusted HTML strings. */
    function createCard(item) {
      const card = document.createElement("article");
      card.className = "card";

      const art = document.createElement(item.url ? "a" : "div");
      art.className = "art";
      if (item.url) {
        art.href = item.url;
        art.target = "_blank";
        art.rel = "noopener noreferrer";
        art.setAttribute("aria-label", item.title || "Open title");
      }

      const fallback = document.createElement("div");
      fallback.className = "fallback";
      fallback.textContent = item.title || "Netflix";
      art.append(fallback);

      const imageUrl = item.boxartEmbedded || item.boxartUrl || item.posterUrl;
      if (imageUrl) {
        const img = document.createElement("img");
        img.loading = "lazy";
        img.decoding = "async";
        img.alt = "";
        img.src = imageUrl;
        img.addEventListener("load", () => fallback.remove(), { once: true });
        img.addEventListener("error", () => img.remove(), { once: true });
        art.append(img);
      }

      const body = document.createElement("div");
      body.className = "body";

      const title = document.createElement("h2");
      title.textContent = item.title || "Untitled";
      body.append(title, createChips(item));

      if (item.synopsis) {
        const synopsis = document.createElement("p");
        synopsis.className = "synopsis";
        synopsis.textContent = item.synopsis;
        body.append(synopsis);
      }

      body.append(createLinks(item));
      card.append(art, body);
      return card;
    }

    /** Creates compact metadata chips for a card. */
    function createChips(item) {
      const chips = document.createElement("div");
      chips.className = "chips";

      const dateText = state.mode === "expiring"
        ? item.expiryText || item.expiryDate
        : item.addedText || item.addedDate;
      addChip(chips, dateText, state.mode === "expiring" ? "date-chip" : "new-chip");
      addChip(chips, item.type);
      addChip(chips, item.year);
      addChip(chips, item.runtime);
      item.genres.slice(0, 3).forEach((genre) => addChip(chips, genre));

      return chips;
    }

    /** Creates outbound links for uNoGS, Netflix, and IMDb when IDs exist. */
    function createLinks(item) {
      const links = document.createElement("div");
      links.className = "links";

      if (item.url) {
        addLink(links, item.url, "uNoGS", "primary");
      }

      if (item.netflixId) {
        addLink(links, "https://www.netflix.com/title/" + encodeURIComponent(item.netflixId), "Netflix");
      }

      if (item.imdbId) {
        addLink(links, "https://www.imdb.com/title/" + encodeURIComponent(item.imdbId) + "/", "IMDb");
      }

      return links;
    }

    /** Adds a chip when the value is present. */
    function addChip(parent, value, className) {
      if (!value) return;
      const chip = document.createElement("span");
      chip.className = "chip" + (className ? " " + className : "");
      chip.textContent = value;
      parent.append(chip);
    }

    /** Adds a safe external link to the card action row. */
    function addLink(parent, href, text, className) {
      const link = document.createElement("a");
      link.className = "link" + (className ? " " + className : "");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = text;
      parent.append(link);
    }

    /** Returns true when an item matches the active type filter. */
    function matchesType(item, type) {
      return !type || item.type === type;
    }

    /** Returns true when an item matches the search query. */
    function matchesQuery(item, query) {
      if (!query) return true;
      return [
        item.title,
        item.year,
        item.type,
        item.runtime,
        item.imdbId,
        item.netflixId,
        item.synopsis,
        item.genres.join(" ")
      ].join(" ").toLowerCase().includes(query);
    }

    /** Compares two titles according to the selected sort mode. */
    function compareItems(a, b, sort) {
      if (sort === "title") {
        return a.title.localeCompare(b.title);
      }

      if (sort === "year") {
        return numberValue(b.year) - numberValue(a.year) || a.title.localeCompare(b.title);
      }

      const dateA = Date.parse(state.mode === "expiring" ? a.expiryDate : a.addedDate) || 0;
      const dateB = Date.parse(state.mode === "expiring" ? b.expiryDate : b.addedDate) || 0;
      return state.mode === "expiring"
        ? dateA - dateB || a.title.localeCompare(b.title)
        : dateB - dateA || a.title.localeCompare(b.title);
    }

    /** Returns the active snapshot or an empty placeholder. */
    function activeSnapshot() {
      return state.snapshots[state.mode] || { sourceUrl: "", collectedAt: "", candidatesAnalyzed: 0, items: [] };
    }

    /** Formats an ISO date for compact display. */
    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    /** Converts nullable values to strings. */
    function stringValue(value) {
      return value == null ? "" : String(value);
    }

    /** Converts nullable values to finite numbers. */
    function numberValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    /** Returns a singular or plural label. */
    function plural(count, singular) {
      return count === 1 ? singular : singular + "s";
    }

    elements.tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        state.mode = tab.dataset.mode;
        loadSnapshot(false);
      });
    });

    elements.searchBox.addEventListener("input", render);
    elements.typeFilter.addEventListener("change", render);
    elements.sortSelect.addEventListener("change", render);
    elements.refreshBtn.addEventListener("click", () => loadSnapshot(true));

    loadSnapshot(false);
  </script>
</body>
</html>
