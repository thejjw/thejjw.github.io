<!DOCTYPE html>
<html>
<head>
  <title>Simple Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <style>
    body,
    html {
      font-family: Arial, sans-serif;
      padding: 10px 20px;
    }

    .download-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    #download-status {
      border: solid 1px black;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -2px rgba(0, 0, 0, .05);
      padding: 10px;
    }

    .chat-container {
      height: 400px;
      width: 100%;
      border: 2px solid black;
      display: flex;
      flex-direction: column;
    }

    .chat-box {
      overflow-y: scroll;
      background-color: #c3c3c3;
      border: 1px solid #ccc;
      padding: 5px;
      flex: 1 1;
    }

    .chat-stats {
      background-color: #D3ECEB;
      flex: 0 0;
      padding: 10px;
      font-size: 0.75rem;
    }

    .message-container {
      width: 100%;
      display: flex;
    }

    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      width: fit-content;
    }

    .message-container.user {
      justify-content: end;
    }

    .message-container.assistant {
      justify-content: start;
    }

    .message-container.user .message {
      background: #007bff;
      color: #fff;
    }

    .message-container.assistant .message {
      background: #f1f0f0;
      color: #333;
    }

    .chat-input-container {
      min-height: 40px;
      flex: 0 0;
      display: flex;
    }

    #user-input {
      width: 70%;
      padding: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 25%;
      padding: 10px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background-color: lightgray;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background-color: #0056b3;
    }

    .model-info {
      margin-bottom: 18px;
      padding: 12px 16px;
      border: 1px solid #ccd4db;
      border-radius: 8px;
      background: linear-gradient(180deg, #f9fbfc 0%, #f2f5f8 100%);
      color: #2c3237;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.12);
    }

    .model-info strong {
      font-weight: 600;
    }

    .model-info span {
      font-weight: 500;
    }

    .hidden {
      display: none;
    }

    /* Footer styling */
    .footer {
      margin-top: 12px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #394046;
      border-top: 1px solid #e6e6e6;
      background: linear-gradient(180deg, #fbfcfd 0%, #ffffff 100%);
      text-align: center;
      border-radius: 6px;
      box-shadow: 0 6px 10px -6px rgba(0, 0, 0, 0.12);
    }

    .footer a {
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>
    Step 1: Initialize WebLLM and Download Model
  </p>
  <div class="download-container">
    <select id="model-selection"></select>
    <button id="download">
      Download
    </button>
  </div>
  <p id="download-status" class="hidden"></p>

  <div id="model-info" class="model-info hidden">
    <p><strong>VRAM Required:</strong> <span id="model-vram"></span></p>
    <p><strong>Low Resource Mode:</strong> <span id="model-low-resource"></span></p>
    <p><strong>Context Window:</strong> <span id="model-context-window"></span></p>
  </div>

  <p>
    Step 2: Chat
  </p>
  <div class="chat-container">
    <div id="chat-box" class="chat-box"></div>
    <div id="chat-stats" class="chat-stats hidden"></div>
    <div class="chat-input-container">
      <input type="text" id="user-input" placeholder="Type a message..." />
      <button id="send" disabled>Send</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    Using @mlc-ai/web-llm • All processing, aside from model download, done locally in browser<br>
    <a href="https://jjw.is-a.dev">@thejjw</a> • 2025.10.
  </div>

  <script type="module">
    import * as webllm from "./lib/mlc-ai/web-llm@0.2.79/index.js";

    /*************** WebLLM logic ***************/
    const messages = [
      {
        content: "You are a helpful AI agent helping users.",
        role: "system",
      },
    ];

    const availableModels = webllm.prebuiltAppConfig.model_list.map(
      (m) => m.model_id,
    );
    let selectedModel = "Qwen3-0.6B-q4f32_1-MLC"; // "Llama-3-8B-Instruct-q4f32_1-MLC-1k";

    const modelMetadataMap = new Map(
      webllm.prebuiltAppConfig.model_list.map((modelConfig) => [
        modelConfig.model_id,
        modelConfig,
      ]),
    );

    const modelSelection = document.getElementById("model-selection");
    const modelInfo = document.getElementById("model-info");
    const modelVram = document.getElementById("model-vram");
    const modelLowResource = document.getElementById("model-low-resource");
    const modelContextWindow = document.getElementById("model-context-window");

    // Callback function for initializing progress
    function updateEngineInitProgressCallback(report) {
      console.log("initialize", report.progress);
      const status = document.getElementById("download-status");
      status.classList.remove("hidden");
      status.textContent = report.text;
    }

    // Create engine instance
    const engine = new webllm.MLCEngine();
    engine.setInitProgressCallback(updateEngineInitProgressCallback);

    function updateModelInfoPanel(modelId) {
      const modelConfig = modelMetadataMap.get(modelId);
      if (!modelConfig) {
        modelInfo.classList.add("hidden");
        modelVram.textContent = "Unknown";
        modelLowResource.textContent = "Unknown";
        modelContextWindow.textContent = "Unknown";
        return;
      }

      modelInfo.classList.remove("hidden");

      const vramValue =
        typeof modelConfig.vram_required_MB === "number" &&
        Number.isFinite(modelConfig.vram_required_MB)
          ? `${modelConfig.vram_required_MB.toLocaleString(undefined, {
              maximumFractionDigits: 2,
            })} MB`
          : "Unknown";
      modelVram.textContent = vramValue;

      const lowResource = modelConfig.low_resource_required;
      let lowResourceValue = "Unknown";
      if (lowResource === true) {
        lowResourceValue = "Yes";
      } else if (lowResource === false) {
        lowResourceValue = "No";
      }
      modelLowResource.textContent = lowResourceValue;

      const contextWindowSize = modelConfig.overrides?.context_window_size;
      const contextWindowValue =
        typeof contextWindowSize === "number" &&
        Number.isFinite(contextWindowSize)
          ? `${contextWindowSize.toLocaleString()} tokens`
          : "Unknown";
      modelContextWindow.textContent = contextWindowValue;
    }

    async function initializeWebLLMEngine() {
      selectedModel = modelSelection.value;
      updateModelInfoPanel(selectedModel);
      const config = {
        temperature: 1.0,
        top_p: 1,
      };
      await engine.reload(selectedModel, config);
    }

    async function streamingGenerating(messages, onUpdate, onFinish, onError) {
      try {
        let curMessage = "";
        const completion = await engine.chat.completions.create({
          stream: true,
          messages,
        });
        for await (const chunk of completion) {
          const curDelta = chunk.choices[0].delta.content;
          if (curDelta) {
            curMessage += curDelta;
          }
          onUpdate(curMessage);
        }
        const finalMessage = await engine.getMessage();
        onFinish(finalMessage);
      } catch (err) {
        onError(err);
      }
    }

    /*************** UI logic ***************/
    function onMessageSend() {
      const input = document.getElementById("user-input").value.trim();
      const message = {
        content: input,
        role: "user",
      };
      if (input.length === 0) {
        return;
      }
      document.getElementById("send").disabled = true;

      messages.push(message);
      appendMessage(message);

      document.getElementById("user-input").value = "";
      document
        .getElementById("user-input")
        .setAttribute("placeholder", "Generating...");

      const aiMessage = {
        content: "typing...",
        role: "assistant",
      };
      appendMessage(aiMessage);

      const onFinishGenerating = (finalMessage) => {
        updateLastMessage(finalMessage);
        document.getElementById("send").disabled = false;
        engine.runtimeStatsText().then(statsText => {
          const stats = document.getElementById('chat-stats');
          stats.classList.remove('hidden');
          stats.textContent = statsText;
        })
      };

      streamingGenerating(
        messages,
        updateLastMessage,
        onFinishGenerating,
        console.error,
      );
    }

    function appendMessage(message) {
      const chatBox = document.getElementById("chat-box");
      const container = document.createElement("div");
      container.classList.add("message-container");
      const newMessage = document.createElement("div");
      newMessage.classList.add("message");
      newMessage.textContent = message.content;

      if (message.role === "user") {
        container.classList.add("user");
      } else {
        container.classList.add("assistant");
      }

      container.appendChild(newMessage);
      chatBox.appendChild(container);
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the latest message
    }

    function updateLastMessage(content) {
      const messageDoms = document
        .getElementById("chat-box")
        .querySelectorAll(".message");
      const lastMessageDom = messageDoms[messageDoms.length - 1];
      lastMessageDom.textContent = content;
    }

    /*************** UI binding ***************/
    availableModels.forEach((modelId) => {
      const option = document.createElement("option");
      option.value = modelId;
      option.textContent = modelId;
      modelSelection.appendChild(option);
    });
    modelSelection.value = selectedModel;
    updateModelInfoPanel(selectedModel);
    modelSelection.addEventListener("change", function (event) {
      selectedModel = event.target.value;
      updateModelInfoPanel(selectedModel);
    });
    document.getElementById("download").addEventListener("click", function () {
      initializeWebLLMEngine().then(() => {
        document.getElementById("send").disabled = false;
      });
    });
    document.getElementById("send").addEventListener("click", function () {
      onMessageSend();
    });
    document.getElementById("user-input").addEventListener("keyup", function (event) {
      if (event.key === "Enter") {
        onMessageSend();
      }
    });
  </script>
</body>
</html>
