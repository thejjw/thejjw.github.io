name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Cache ArtCraft release artifacts
        uses: actions/cache@v4
        with:
          path: .artcraft/cache
          key: artcraft-${{ hashFiles('artcraft/manifest.json') }}
          restore-keys: artcraft-

      - name: Fetch ArtCraft applications
        run: npm run artcraft:fetch

      - name: Build with vite
        run: npm run build

      - name: Assemble ArtCraft applications
        run: npm run artcraft:assemble

      - name: Validate the site
        run: npm run artcraft:validate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: ${{ !inputs.dry_run }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
