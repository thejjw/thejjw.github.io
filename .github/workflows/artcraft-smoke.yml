name: ArtCraft smoke tests

on:
  workflow_run:
    workflows: ['Deploy']
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        type: string
        default: 'https://thejjw.github.io'

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke tests against the deployed site
        env:
          ARTCRAFT_BASE_URL: ${{ github.event.inputs.base_url || 'https://thejjw.github.io' }}
        run: npm run artcraft:smoke
