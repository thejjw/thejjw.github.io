name: Test Deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run prettier
        run: npm run prettier

      - name: Cache ArtCraft release artifacts
        uses: actions/cache@v4
        with:
          path: .artcraft/cache
          key: artcraft-${{ hashFiles('artcraft/manifest.json') }}
          restore-keys: artcraft-

      - name: Fetch ArtCraft applications
        run: npm run artcraft:fetch

      - name: Build
        run: npm run build
        env:
          CI: ''

      - name: Assemble ArtCraft applications
        run: npm run artcraft:assemble

      - name: Validate the site
        run: npm run artcraft:validate
